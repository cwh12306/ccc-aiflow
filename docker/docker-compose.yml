services:
    ccc-aiflow-postgresql:
        image: postgres:18.1
        container_name: ccc-aiflow-postgresql
        ports:
            - '5432:5432'
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_DB=postgres
            # - POSTGRESQL_USERNAME=ccc
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            # - POSTGRESQL_DATABASE=postgres
        volumes:
            - ./postgresql_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
        # 日志控制，很重要防止服务器被日志文件爆满
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '3'

    # Qdrant 向量数据库
    ccc-aiflow-qdrant:
        image: qdrant/qdrant:latest@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
        container_name: ccc-aiflow-qdrant
        ports:
            - '6333:6333' # REST API
            - '6334:6334' # gRPC
        volumes:
            - ./qdrant_storage:/qdrant/storage
        healthcheck:
            test: ['CMD-SHELL', 'bash -c ": >/dev/tcp/127.0.0.1/6333"']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '3'

networks:
    default:
        name: ccc-aiflow-network
        driver: bridge
